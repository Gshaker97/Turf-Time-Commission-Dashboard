name: Verify guarded Sheet reconciliation (one-shot batch regression)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: verified-sheet-batch-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.head_ref == 'jarvis/verified-sheet-one-shot-batch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      ARC_DISABLE_TIMERS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # package.json >=20; locked ESLint supports ^22.13.0. Supported Node22.
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repository lint
        run: npm run lint
      - name: Repository production build (does not start server)
        run: npm run build
      - name: Guarded reconciliation tests and actual PDF parser fixture
        env:
          RUN_PDF_PARSE_INTEGRATION: '1'
        run: node --test test/*.test.mjs
      - name: Server syntax only (never start it)
        run: node --check server.js
